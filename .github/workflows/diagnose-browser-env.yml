name: Diagnose browser package sources
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read public Ubuntu repository configuration
        run: |
          python3 - <<'PYTHON'
          import pathlib
          apt_root = pathlib.Path('/etc/apt')
          for source_file in sorted(apt_root.rglob('*')):
              if source_file.is_file() and (source_file.suffix in ('.list', '.sources') or 'mirror' in source_file.name):
                  print(str(source_file))
                  print(source_file.read_text())
          PYTHON
